# MA Stage Monitor - Example Configuration
# Book-faithful US-stock default: adjusted daily 5/20/40 EMA.

tickers:
  - MSFT
  - AMZN
  - META
  - AVGO
  - GOOGL
  - SOXX
  - QQQM
  - LRCX

# Keep these defaults for the primary monitor.
interval: "1d"
ma_type: "ema"
ma_windows: [5, 20, 40]

# Use a different directory for a separate weekly monitor.
state_dir: "~/.ma-stage-monitor"
timezone: "America/Los_Angeles"
output_format: "table"
