# MA Stage Monitor - Example Configuration
# Book-faithful US-stock default: adjusted daily 5/20/40 EMA.

core_tickers:
  - META
  - IVV
  - MSFT
  - AMZN
  - GOOGL
  - QQQ
  - SOXX
  - NVDA
  - AVGO

# Frequently updated tactical watchlist.
satellite_tickers:
  - QQQM
  - LRCX
  - AEP

interval: "1d"
ma_type: "ema"
ma_windows: [5, 20, 40]
state_dir: "~/.ma-stage-monitor"
timezone: "America/Los_Angeles"
output_format: "table"
